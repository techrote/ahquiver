; AHQuiver baseline configuration.
; Copy this file to config\ahquiver.ini for local overrides.

[core]
log_enabled=1
log_path=logs\ahquiver.log

; Every feature module is disabled unless explicitly enabled.
[modules]
F01=0
F02=0
F03=0
F04=0
F05=0
F06=0
F07=0
F08=0
F09=0
F10=0
F11=0
F12=0
F13=0

; F01 — Close matching windows.
[F01]
hotkey=
match_class=0
match_title=0
protect_self=1
protect_shell=1
exclude_exes=
exclude_classes=
preview=0
confirm=1
confirm_min=2
close_timeout_ms=750

; F02 — Terminal identity / project launcher.
[F02]
presets=example_terminal,example_shell

[F02.preset.example_terminal]
kind=windows_terminal
identity=AHQuiver Implementer
role=implementer
program=wt.exe
working_dir=.
title=AHQuiver Implementer
title_mode=cli
window_name=ahquiver-example
profile=
singleton=1
singleton_mode=sticky
arg_count=0
icon=
shortcut=

[F02.preset.example_shell]
kind=process
identity=AHQuiver Reviewer
role=reviewer
program=pwsh.exe
working_dir=.
title=AHQuiver Reviewer
title_mode=none
terminal_kind=unknown
singleton=0
singleton_mode=pid
window_wait_ms=750
arg_count=1
arg1=-NoExit
icon=
shortcut=

; F03 — Context-sensitive terminal key guard.
[F03]
hotkey=^c
chord=^c
hold_key=c
bypass_hotkey=^+c
toggle_hotkey=^!c
rules=windows_terminal
feedback=tray
log_decisions=1

[F03.rule.windows_terminal]
terminal=WindowsTerminal
exe=
class=
title_contains=
identity=
role=
policy=double_tap
double_tap_ms=450
hold_ms=450
remap_chord=
selection_copy_passthrough=1

; F04 — Focus-preserving paste capability layer.
[F04]
capture_hotkey=
background_paste_hotkey=
focus_handoff_hotkey=
probe_on_start=0
auto_probe_standard_edit=1
allow_focus_handoff=0
target_max_age_ms=300000
activation_timeout_ms=750
restore_timeout_ms=750

; F05 — Safe multiline terminal paste.
; AHQuiver controls delivery semantics only; it does not parse or repair shell syntax.
; The conservative default is cancel. Bind any mode hotkey only if you want it globally.
[F05]
default_mode=cancel
inter_line_delay_ms=100
allow_unknown_terminal=0
allow_control_chars=0
whole_hotkey=
lines_hotkey=
confirm_hotkey=
pattern_count=0
; pattern1=your-regex-here

; F06 — Tracker restart / relaunch.
[F06]
presets=

; Example only — adapt for your machine/project before adding to F06.presets.
; [F06.tracker.example_tracker]
; program=python.exe
; working_dir=C:\path\to\project
; expected_exe=python.exe
; expected_path=
; arg_count=2
; arg1=Watch-DashMinimix-AuditProgress.py
; arg2=C:\path\to\worktree
; allow_force=0
; graceful_timeout_ms=1500
; force_timeout_ms=1000
; worker_exclude_exes=opencode.exe,codex.exe
; identity=Audit progress tracker
; restore_title=0
; title=Audit progress tracker
; window_wait_ms=750

; F07 — Unified tray / compact GUI control surface.
[F07]
history_limit=10
action_menu=1

; F08 — External keybind/profile layer.
[F08]
profiles=
bindings=
bypass_hotkey=

; Harmless F08 examples.
; [F08.profile.terminal]
; enabled=1
; priority=20
; exe=WindowsTerminal.exe
; class=
; identity=
; [F08.binding.terminal_status]
; enabled=1
; hotkey=^!s
; action=keybind.status
; profile=terminal
; priority=10
; param_count=0

; F09 — Local hardware/controller event bridge.
; Serial is the production transport. Wire messages are newline-delimited:
; AQ1|event.id|value|sequence
; The device supplies an event ID only; local mappings choose registered actions.
[F09]
transport=serial
device=
baud=115200
poll_ms=25
max_events_per_poll=16
max_events_per_second=60
mappings=

; Harmless examples: both map to the read-only keybind.status action. Adapt event
; IDs and local action mappings for your controller, then list the mapping IDs above.
; [F09.mapping.green_button]
; enabled=1
; event=button.green
; action=keybind.status
; value_type=enum
; allowed_values=press,release
; value_param=state
; debounce_ms=120
; param_count=0
;
; [F09.mapping.main_encoder]
; enabled=1
; event=encoder.main
; action=keybind.status
; value_type=int
; min=-4
; max=4
; value_param=delta
; debounce_ms=0
; param_count=0
