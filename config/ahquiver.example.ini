; AHQuiver baseline configuration.
; Copy this file to config\ahquiver.ini for local overrides.

[core]
log_enabled=1
log_path=logs\ahquiver.log

; Every feature module is disabled unless explicitly enabled.
[modules]
F01=0
F02=0
F03=0
F04=0
F05=0
F06=0
F07=0
F08=0
F09=0
F10=0
F11=0
F12=0
F13=0

; F01 — Close matching windows.
; Enable F01 above before this section has any effect.
; hotkey is intentionally empty by default to avoid claiming a global chord.
[F01]
hotkey=
match_class=0
match_title=0
protect_self=1
protect_shell=1
exclude_exes=
exclude_classes=
preview=0
confirm=1
confirm_min=2
close_timeout_ms=750

; F02 — Terminal identity / project launcher.
; Presets are named explicitly so config errors stay local and deterministic.
; Arguments are numbered rather than stored as a shell command string, so
; AHQuiver can quote each argument independently.
[F02]
presets=example_terminal,example_shell

; Windows Terminal preset. AHQuiver builds:
; wt.exe -w <window_name> new-tab --title <title> --suppressApplicationTitle -d <working_dir> ...
; A named window plus sticky singleton is useful when you want one durable
; project/role destination even though wt.exe itself may hand off and exit.
[F02.preset.example_terminal]
kind=windows_terminal
identity=AHQuiver Implementer
role=implementer
program=wt.exe
working_dir=.
title=AHQuiver Implementer
title_mode=cli
window_name=ahquiver-example
profile=
singleton=1
singleton_mode=sticky
arg_count=0
icon=
shortcut=

; Generic process preset. title_mode=window may be enabled for applications
; whose visible top-level HWND is owned by the launched PID; none is safer as
; a portable default because console/terminal hosts can use another PID.
[F02.preset.example_shell]
kind=process
identity=AHQuiver Reviewer
role=reviewer
program=pwsh.exe
working_dir=.
title=AHQuiver Reviewer
title_mode=none
terminal_kind=unknown
singleton=0
singleton_mode=pid
window_wait_ms=750
arg_count=1
arg1=-NoExit
icon=
shortcut=
