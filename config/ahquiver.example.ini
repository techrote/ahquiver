; AHQuiver baseline configuration.
; Copy this file to config\ahquiver.ini for local overrides.

[core]
log_enabled=1
log_path=logs\ahquiver.log

; Every feature module is disabled unless explicitly enabled.
[modules]
F01=0
F02=0
F03=0
F04=0
F05=0
F06=0
F07=0
F08=0
F09=0
F10=0
F11=0
F12=0
F13=0

; F01 — Close matching windows.
; Enable F01 above before this section has any effect.
; hotkey is intentionally empty by default to avoid claiming a global chord.
[F01]
hotkey=
match_class=0
match_title=0
protect_self=1
protect_shell=1
exclude_exes=
exclude_classes=
preview=0
confirm=1
confirm_min=2
close_timeout_ms=750

; F02 — Terminal identity / project launcher.
; Presets are named explicitly so config errors stay local and deterministic.
; Arguments are numbered rather than stored as a shell command string, so
; AHQuiver can quote each argument independently.
[F02]
presets=example_terminal,example_shell

; Windows Terminal preset. AHQuiver builds:
; wt.exe -w <window_name> new-tab --title <title> --suppressApplicationTitle -d <working_dir> ...
; A named window plus sticky singleton is useful when you want one durable
; project/role destination even though wt.exe itself may hand off and exit.
[F02.preset.example_terminal]
kind=windows_terminal
identity=AHQuiver Implementer
role=implementer
program=wt.exe
working_dir=.
title=AHQuiver Implementer
title_mode=cli
window_name=ahquiver-example
profile=
singleton=1
singleton_mode=sticky
arg_count=0
icon=
shortcut=

; Generic process preset. title_mode=window may be enabled for applications
; whose visible top-level HWND is owned by the launched PID; none is safer as
; a portable default because console/terminal hosts can use another PID.
[F02.preset.example_shell]
kind=process
identity=AHQuiver Reviewer
role=reviewer
program=pwsh.exe
working_dir=.
title=AHQuiver Reviewer
title_mode=none
terminal_kind=unknown
singleton=0
singleton_mode=pid
window_wait_ms=750
arg_count=1
arg1=-NoExit
icon=
shortcut=

; F03 — Context-sensitive terminal key guard.
; The whole module is disabled by default above. When enabled, the guarded
; hotkey only applies a policy when one of the named rules matches the current
; context. Outside matching contexts the original chord is passed through.
[F03]
hotkey=^c
chord=^c
hold_key=c
bypass_hotkey=^+c
toggle_hotkey=^!c
rules=windows_terminal
feedback=tray
log_decisions=1

; Default example: a single Ctrl+C in Windows Terminal is blocked; press it a
; second time within 450 ms to deliver the interrupt. Ctrl+Shift+C is an
; immediate bypass and Ctrl+Alt+C toggles the guard runtime on/off.
[F03.rule.windows_terminal]
terminal=WindowsTerminal
exe=
class=
title_contains=
identity=
role=
policy=double_tap
double_tap_ms=450
hold_ms=450
remap_chord=
selection_copy_passthrough=1

; Additional named rules may use policy=pass_through, double_tap, hold,
; confirm, or remap. For remap, set remap_chord. Rules are evaluated in the
; order listed by F03.rules and can narrow by terminal/exe/class/title,
; plus F02-owned identity/role when that identity is PID-attributable.
