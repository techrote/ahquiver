; AHQuiver baseline configuration.
; Copy this file to config\ahquiver.ini for local overrides.

[core]
log_enabled=1
log_path=logs\ahquiver.log

; Every feature module is disabled unless explicitly enabled.
[modules]
F01=0
F02=0
F03=0
F04=0
F05=0
F06=0
F07=0
F08=0
F09=0
F10=0
F11=0
F12=0
F13=0

; F01 — Close matching windows.
; Enable F01 above before this section has any effect.
; hotkey is intentionally empty by default to avoid claiming a global chord.
[F01]
hotkey=
match_class=0
match_title=0
protect_self=1
protect_shell=1
exclude_exes=
exclude_classes=
preview=0
confirm=1
confirm_min=2
close_timeout_ms=750

; F02 — Terminal identity / project launcher.
[F02]
presets=example_terminal,example_shell

[F02.preset.example_terminal]
kind=windows_terminal
identity=AHQuiver Implementer
role=implementer
program=wt.exe
working_dir=.
title=AHQuiver Implementer
title_mode=cli
window_name=ahquiver-example
profile=
singleton=1
singleton_mode=sticky
arg_count=0
icon=
shortcut=

[F02.preset.example_shell]
kind=process
identity=AHQuiver Reviewer
role=reviewer
program=pwsh.exe
working_dir=.
title=AHQuiver Reviewer
title_mode=none
terminal_kind=unknown
singleton=0
singleton_mode=pid
window_wait_ms=750
arg_count=1
arg1=-NoExit
icon=
shortcut=

; F03 — Context-sensitive terminal key guard.
[F03]
hotkey=^c
chord=^c
hold_key=c
bypass_hotkey=^+c
toggle_hotkey=^!c
rules=windows_terminal
feedback=tray
log_decisions=1

[F03.rule.windows_terminal]
terminal=WindowsTerminal
exe=
class=
title_contains=
identity=
role=
policy=double_tap
double_tap_ms=450
hold_ms=450
remap_chord=
selection_copy_passthrough=1

; F04 — Focus-preserving paste capability layer.
; No global gesture is claimed by default. A future binding can invoke
; terminal.paste_target_capture_mouse followed by terminal.paste_background.
; True background paste executes only when a target adapter has a verified
; `supported` capability. Windows Terminal remains unknown unless a reliable
; readback probe proves otherwise. The activate/send/restore path is a separate
; degraded action and is disabled by default.
[F04]
capture_hotkey=
background_paste_hotkey=
focus_handoff_hotkey=
probe_on_start=0
auto_probe_standard_edit=1
allow_focus_handoff=0
target_max_age_ms=300000
activation_timeout_ms=750
restore_timeout_ms=750
