name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ahk-v2:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2.0.28 portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2.0.28'
          $expectedSha256 = 'B63BE7548792B4AD0DFE424D91CC69376694ED2F758245B7A75A0C77D693B478'
          $zip = Join-Path $env:RUNNER_TEMP "AutoHotkey_$version.zip"
          $dest = Join-Path $env:RUNNER_TEMP 'autohotkey-v2'
          $uri = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/AutoHotkey_$version.zip"
          Invoke-WebRequest -Uri $uri -OutFile $zip
          $actualSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "AutoHotkey archive SHA256 mismatch: $actualSha256"
          }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Filter AutoHotkey64.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw 'AutoHotkey64.exe not found after extraction.' }
          "AHK_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $exe"

      - name: Foundation tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\tests\TestRunner.ahk') -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Foundation tests failed with AutoHotkey exit code $($process.ExitCode)."
          }

      - name: Headless startup probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\src\AHQuiver.ahk', '--probe-startup', '--headless', '--config', '.\config\ahquiver.example.ini') -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Headless startup probe failed with AutoHotkey exit code $($process.ExitCode)."
          }
