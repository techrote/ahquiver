name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ahk-v2:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2.0.28 portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2.0.28'
          $zip = Join-Path $env:RUNNER_TEMP "AutoHotkey_$version.zip"
          $dest = Join-Path $env:RUNNER_TEMP 'autohotkey-v2'
          Invoke-WebRequest -Uri "https://www.autohotkey.com/download/2.0/AutoHotkey_$version.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Filter AutoHotkey64.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw 'AutoHotkey64.exe not found after extraction.' }
          "AHK_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $exe"

      - name: Foundation tests
        shell: pwsh
        run: |
          & $env:AHK_EXE /ErrorStdOut .\tests\TestRunner.ahk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Headless startup probe
        shell: pwsh
        run: |
          & $env:AHK_EXE /ErrorStdOut .\src\AHQuiver.ahk --probe-startup --headless --config .\config\ahquiver.example.ini
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
