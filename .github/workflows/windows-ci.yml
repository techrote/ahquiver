name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ahk-v2:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2.0.28 portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2.0.28'
          $expectedSha256 = 'B63BE7548792B4AD0DFE424D91CC69376694ED2F758245B7A75A0C77D693B478'
          $zip = Join-Path $env:RUNNER_TEMP "AutoHotkey_$version.zip"
          $dest = Join-Path $env:RUNNER_TEMP 'autohotkey-v2'
          $uri = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/AutoHotkey_$version.zip"
          Invoke-WebRequest -Uri $uri -OutFile $zip
          $actualSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) { throw "AutoHotkey archive SHA256 mismatch: $actualSha256" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Filter AutoHotkey64.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw 'AutoHotkey64.exe not found after extraction.' }
          "AHK_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $exe"

      - name: Foundation tests
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\tests\TestRunner.ahk') -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Foundation tests failed with AutoHotkey exit code $($process.ExitCode)." }

      - name: F01 feature tests
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'f01-tests.stdout.txt'; $stderr = Join-Path $env:RUNNER_TEMP 'f01-tests.stderr.txt'; $progress = Join-Path $env:RUNNER_TEMP 'f01-tests.progress.txt'; $env:AQ_TEST_PROGRESS = $progress
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\tests\F01TestRunner.ahk') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $timedOut = -not $process.WaitForExit(20000); if ($timedOut) { try { $process.Kill($true) } catch { $process.Kill() }; $process.WaitForExit() }
          if (Test-Path $progress) { Get-Content $progress | ForEach-Object { Write-Host $_ } }; if (Test-Path $stdout) { Get-Content $stdout | ForEach-Object { Write-Host $_ } }; if (Test-Path $stderr) { Get-Content $stderr | ForEach-Object { Write-Host "STDERR: $_" } }
          if ($timedOut) { throw 'F01 feature tests exceeded timeout.' }; if ($process.ExitCode -ne 0) { throw "F01 feature tests failed: $($process.ExitCode)" }

      - name: F01 real window-close smoke
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\tests\F01WindowSmoke.ahk') -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "F01 smoke failed: $($process.ExitCode)" }

      - name: F02 feature tests
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'f02-tests.stdout.txt'; $stderr = Join-Path $env:RUNNER_TEMP 'f02-tests.stderr.txt'; $progress = Join-Path $env:RUNNER_TEMP 'f02-tests.progress.txt'; $env:AQ_TEST_PROGRESS = $progress
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\tests\F02TestRunner.ahk') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $timedOut = -not $process.WaitForExit(20000); if ($timedOut) { try { $process.Kill($true) } catch { $process.Kill() }; $process.WaitForExit() }
          if (Test-Path $progress) { Get-Content $progress | ForEach-Object { Write-Host $_ } }; if (Test-Path $stdout) { Get-Content $stdout | ForEach-Object { Write-Host $_ } }; if (Test-Path $stderr) { Get-Content $stderr | ForEach-Object { Write-Host "STDERR: $_" } }
          if ($timedOut) { throw 'F02 feature tests exceeded timeout.' }; if ($process.ExitCode -ne 0) { throw "F02 feature tests failed: $($process.ExitCode)" }

      - name: F02 real process/title smoke
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\tests\F02ProcessSmoke.ahk') -NoNewWindow -PassThru
          if (-not $process.WaitForExit(20000)) { try { $process.Kill($true) } catch { $process.Kill() }; throw 'F02 smoke exceeded timeout.' }
          if ($process.ExitCode -ne 0) { throw "F02 smoke failed: $($process.ExitCode)" }

      - name: Windows Terminal CLI availability probe
        shell: pwsh
        run: |
          $wt = Get-Command wt.exe -ErrorAction SilentlyContinue
          if (-not $wt) { Write-Host 'SKIP: wt.exe not installed'; exit 0 }
          Write-Host "Windows Terminal CLI found at $($wt.Source)"
          & $wt.Source -? | Select-Object -First 20 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "wt.exe help probe failed: $LASTEXITCODE" }

      - name: F03 feature tests
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'f03-tests.stdout.txt'; $stderr = Join-Path $env:RUNNER_TEMP 'f03-tests.stderr.txt'; $progress = Join-Path $env:RUNNER_TEMP 'f03-tests.progress.txt'; $env:AQ_TEST_PROGRESS = $progress
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\tests\F03TestRunner.ahk') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $timedOut = -not $process.WaitForExit(20000); if ($timedOut) { try { $process.Kill($true) } catch { $process.Kill() }; $process.WaitForExit() }
          if (Test-Path $progress) { Get-Content $progress | ForEach-Object { Write-Host $_ } }; if (Test-Path $stdout) { Get-Content $stdout | ForEach-Object { Write-Host $_ } }; if (Test-Path $stderr) { Get-Content $stderr | ForEach-Object { Write-Host "STDERR: $_" } }
          if ($timedOut) { throw 'F03 feature tests exceeded timeout.' }; if ($process.ExitCode -ne 0) { throw "F03 feature tests failed: $($process.ExitCode)" }

      - name: F03 enabled hotkey lifecycle probe
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\src\AHQuiver.ahk', '--probe-startup', '--headless', '--config', '.\tests\F03EnabledStartup.ini') -NoNewWindow -PassThru
          if (-not $process.WaitForExit(20000)) { try { $process.Kill($true) } catch { $process.Kill() }; throw 'F03 startup probe exceeded timeout.' }
          if ($process.ExitCode -ne 0) { throw "F03 startup probe failed: $($process.ExitCode)" }

      - name: F04 feature tests
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'f04-tests.stdout.txt'; $stderr = Join-Path $env:RUNNER_TEMP 'f04-tests.stderr.txt'; $progress = Join-Path $env:RUNNER_TEMP 'f04-tests.progress.txt'; $env:AQ_TEST_PROGRESS = $progress
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\tests\F04TestRunner.ahk') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $timedOut = -not $process.WaitForExit(20000); if ($timedOut) { try { $process.Kill($true) } catch { $process.Kill() }; $process.WaitForExit() }
          if (Test-Path $progress) { Write-Host '--- F04 progress ---'; Get-Content $progress | ForEach-Object { Write-Host $_ } }; if (Test-Path $stdout) { Write-Host '--- F04 stdout ---'; Get-Content $stdout | ForEach-Object { Write-Host $_ } }; if (Test-Path $stderr) { Write-Host '--- F04 stderr ---'; Get-Content $stderr | ForEach-Object { Write-Host $_ } }
          if ($timedOut) { throw 'F04 feature tests exceeded timeout.' }; if ($process.ExitCode -ne 0) { throw "F04 feature tests failed: $($process.ExitCode)" }

      - name: F04 real focus-preserving paste smoke
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\tests\F04RealPasteSmoke.ahk') -NoNewWindow -PassThru
          if (-not $process.WaitForExit(20000)) { try { $process.Kill($true) } catch { $process.Kill() }; throw 'F04 real paste smoke exceeded timeout.' }
          if ($process.ExitCode -ne 0) { throw "F04 real paste smoke failed: $($process.ExitCode)" }

      - name: F05 feature tests
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'f05-tests.stdout.txt'; $stderr = Join-Path $env:RUNNER_TEMP 'f05-tests.stderr.txt'; $progress = Join-Path $env:RUNNER_TEMP 'f05-tests.progress.txt'; $env:AQ_TEST_PROGRESS = $progress
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\tests\F05TestRunner.ahk') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $timedOut = -not $process.WaitForExit(20000); if ($timedOut) { try { $process.Kill($true) } catch { $process.Kill() }; $process.WaitForExit() }
          if (Test-Path $progress) { Write-Host '--- F05 progress ---'; Get-Content $progress | ForEach-Object { Write-Host $_ } }; if (Test-Path $stdout) { Write-Host '--- F05 stdout ---'; Get-Content $stdout | ForEach-Object { Write-Host $_ } }; if (Test-Path $stderr) { Write-Host '--- F05 stderr ---'; Get-Content $stderr | ForEach-Object { Write-Host $_ } }
          if ($timedOut) { throw 'F05 feature tests exceeded timeout.' }; if ($process.ExitCode -ne 0) { throw "F05 feature tests failed: $($process.ExitCode)" }

      - name: F05 enabled module startup probe
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\src\AHQuiver.ahk', '--probe-startup', '--headless', '--config', '.\tests\F05EnabledStartup.ini') -NoNewWindow -PassThru
          if (-not $process.WaitForExit(20000)) { try { $process.Kill($true) } catch { $process.Kill() }; throw 'F05 startup probe exceeded timeout.' }
          if ($process.ExitCode -ne 0) { throw "F05 startup probe failed: $($process.ExitCode)" }

      - name: Headless startup probe
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @('/ErrorStdOut', '.\src\AHQuiver.ahk', '--probe-startup', '--headless', '--config', '.\config\ahquiver.example.ini') -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Headless startup probe failed: $($process.ExitCode)" }
